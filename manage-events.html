<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manage Events – EVENTIFY Organizer Studio</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">
  <link href="/css/style.css" rel="stylesheet">
</head>
<body>
  <div id="ev-navbar-placeholder"></div>

  <div class="ev-dashboard-wrapper">
    <aside class="ev-sidebar" id="ev-organizer-sidebar"></aside>

    <main class="ev-dashboard-main">
      <div class="d-flex flex-wrap justify-content-between align-items-center mb-4">
        <div>
          <span class="text-primary fw-bold small text-uppercase">Event Inventory & Performance</span>
          <h3 class="mb-0">Manage My Events</h3>
        </div>
        <a href="/organizer/create-event.html" class="btn-ev-primary btn-sm">
          <i class="fa-solid fa-plus me-1"></i> Create New Event
        </a>
      </div>

      <!-- Search & Filter Bar -->
      <div class="ev-card p-3 mb-4 h-auto">
        <div class="row g-2 align-items-center">
          <div class="col-md-4">
            <div class="input-group input-group-sm">
              <span class="input-group-text bg-white border-end-0"><i class="fa-solid fa-magnifying-glass text-primary"></i></span>
              <input type="text" id="orgEventSearch" class="form-control border-start-0" placeholder="Search by event title, venue, or city...">
            </div>
          </div>
          <div class="col-md-3">
            <select id="orgCategoryFilter" class="form-select form-select-sm">
              <option value="all">All Categories</option>
            </select>
          </div>
          <div class="col-md-3">
            <select id="orgStatusFilter" class="form-select form-select-sm">
              <option value="all">All Approval & Lifecycle Statuses</option>
              <option value="pending">Pending Approval</option>
              <option value="approved">Approved</option>
              <option value="rejected">Rejected</option>
              <option value="draft">Drafts</option>
              <option value="upcoming">Upcoming</option>
              <option value="completed">Completed</option>
            </select>
          </div>
          <div class="col-md-2">
            <button type="button" onclick="resetOrgFilters()" class="btn-ev-outline btn-sm w-100 justify-content-center">Reset</button>
          </div>
        </div>
      </div>

      <div class="ev-card p-4 h-auto">
        <div class="table-responsive">
          <table class="table align-middle small mb-0">
            <thead class="table-light">
              <tr>
                <th>Event</th>
                <th>Date & Venue</th>
                <th>Pricing</th>
                <th>Ticket Availability & Bookings</th>
                <th>Performance</th>
                <th>Approval & Publish</th>
                <th>Event Status</th>
                <th class="text-end">Actions</th>
              </tr>
            </thead>
            <tbody id="organizerEventsTable">
              <tr><td colspan="8" class="text-center py-4 text-muted">Loading your events...</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/socket.io/socket.io.js"></script>
  <script src="/js/main.js"></script>
  <script src="/js/organizer.js"></script>
  <script>
    let organizerEventsCache = [];

    async function initManageEvents() {
      try {
        const catRes = await EventifyApp.api('/categories');
        const catSelect = document.getElementById('orgCategoryFilter');
        (catRes.categories || []).forEach(c => {
          const opt = document.createElement('option');
          opt.value = c.name;
          opt.textContent = c.name;
          catSelect.appendChild(opt);
        });
      } catch (e) {}

      await loadOrganizerEvents();
      document.getElementById('orgEventSearch').addEventListener('input', renderOrganizerEvents);
      document.getElementById('orgCategoryFilter').addEventListener('change', renderOrganizerEvents);
      document.getElementById('orgStatusFilter').addEventListener('change', renderOrganizerEvents);
    }

    async function loadOrganizerEvents() {
      const tbody = document.getElementById('organizerEventsTable');
      try {
        const res = await EventifyApp.api('/organizer/events');
        organizerEventsCache = res.events || [];
        renderOrganizerEvents();
      } catch (err) {
        tbody.innerHTML = `<tr><td colspan="8" class="text-center py-4 text-danger">${err.message}</td></tr>`;
        EventifyApp.showToast(err.message, 'error');
      }
    }

    function renderOrganizerEvents() {
      const tbody = document.getElementById('organizerEventsTable');
      const q = (document.getElementById('orgEventSearch').value || '').trim().toLowerCase();
      const cat = document.getElementById('orgCategoryFilter').value;
      const st = document.getElementById('orgStatusFilter').value;

      const filtered = organizerEventsCache.filter(e => {
        const matchQ = !q ||
          (e.title && e.title.toLowerCase().includes(q)) ||
          (e.city && e.city.toLowerCase().includes(q)) ||
          (e.venue && e.venue.toLowerCase().includes(q));
        const matchCat = cat === 'all' || e.categoryName === cat;
        let matchSt = true;
        if (st !== 'all') {
          if (['pending', 'approved', 'rejected'].includes(st)) {
            matchSt = e.approvalStatus === st;
          } else if (st === 'draft') {
            matchSt = e.isDraft === true || e.status === 'draft';
          } else {
            matchSt = e.status === st;
          }
        }
        return matchQ && matchCat && matchSt;
      });

      if (filtered.length === 0) {
        tbody.innerHTML = `<tr><td colspan="8" class="text-center py-4 text-muted">No matching events found.</td></tr>`;
        return;
      }

      tbody.innerHTML = filtered.map(e => {
        const sold = Math.max((e.capacity || 0) - (e.availableSeats || 0), e.bookingsCount || 0);
        const estRevenue = sold * (e.ticketPrice || 0);
        const approvalBadge = e.approvalStatus === 'approved'
          ? 'ev-badge-green'
          : e.approvalStatus === 'pending'
            ? 'ev-badge-amber'
            : 'ev-badge-red';

        return `
          <tr>
            <td>
              <div class="d-flex align-items-center gap-3">
                <img src="${e.poster}" class="rounded-2" style="width:56px;height:42px;object-fit:cover;">
                <div>
                  <a href="/event-details.html?id=${e._id}" class="fw-bold text-dark d-block">${e.title}</a>
                  <span class="text-muted" style="font-size:0.75rem;">${e.categoryName} ${e.isDraft ? '• <strong class="text-warning">DRAFT</strong>' : ''}</span>
                </div>
              </div>
            </td>
            <td>
              <div class="fw-semibold">${EventifyApp.formatDate(e.date)}</div>
              <div class="text-muted" style="font-size:0.75rem;">${e.venue}, ${e.city}</div>
            </td>
            <td>
              <div class="fw-bold">${EventifyApp.formatCurrency(e.ticketPrice)}</div>
              <div class="text-muted" style="font-size:0.72rem;">VIP: ${EventifyApp.formatCurrency(e.vipPrice || e.ticketPrice * 2)}</div>
            </td>
            <td>
              <div class="fw-semibold text-dark">${e.availableSeats} / ${e.capacity} available</div>
              <div class="text-primary small fw-bold"><i class="fa-solid fa-ticket me-1"></i>${sold} booked</div>
            </td>
            <td>
              <div class="fw-bold text-success">${EventifyApp.formatCurrency(estRevenue)}</div>
              <div class="text-muted" style="font-size:0.72rem;"><i class="fa-regular fa-eye me-1"></i>${e.viewsCount || 0} views • ★ ${e.averageRating || 4.5}</div>
            </td>
            <td>
              <span class="ev-badge ${approvalBadge}">
                ${e.approvalStatus.toUpperCase()}
              </span>
              ${e.approvalStatus === 'rejected' && e.rejectionReason ? `
                <div class="text-danger mt-1" style="font-size:0.72rem;max-width:190px;" title="${e.rejectionReason}">
                  <i class="fa-solid fa-circle-exclamation me-1"></i>${e.rejectionReason}
                </div>
              ` : ''}
              ${e.approvalStatus === 'approved' ? `
                <div class="form-check form-switch mt-1">
                  <input class="form-check-input" type="checkbox" ${e.isPublished !== false ? 'checked' : ''} onchange="togglePublishEvent('${e._id}', this.checked)">
                  <label class="form-check-label" style="font-size:0.72rem;">${e.isPublished !== false ? 'Published' : 'Unpublished'}</label>
                </div>
              ` : ''}
            </td>
            <td>
              <select class="form-select form-select-sm" style="width:125px;" onchange="changeEventStatus('${e._id}', this.value)">
                <option value="upcoming" ${e.status === 'upcoming' ? 'selected' : ''}>Upcoming</option>
                <option value="ongoing" ${e.status === 'ongoing' ? 'selected' : ''}>Ongoing</option>
                <option value="completed" ${e.status === 'completed' ? 'selected' : ''}>Completed</option>
                <option value="cancelled" ${e.status === 'cancelled' ? 'selected' : ''}>Cancelled</option>
                <option value="draft" ${e.status === 'draft' ? 'selected' : ''}>Draft</option>
              </select>
            </td>
            <td class="text-end">
              <div class="d-inline-flex gap-1">
                <a href="/event-details.html?id=${e._id}" class="btn btn-sm btn-outline-secondary" title="View Event Page">
                  <i class="fa-regular fa-eye"></i>
                </a>
                <a href="/organizer/create-event.html?editId=${e._id}" class="btn btn-sm btn-ev-lavender" title="Edit Event">
                  <i class="fa-solid fa-pen"></i>
                </a>
                <button onclick="deleteEvent('${e._id}')" class="btn btn-sm btn-outline-danger" title="Delete Event">
                  <i class="fa-solid fa-trash"></i>
                </button>
              </div>
            </td>
          </tr>
        `;
      }).join('');
    }

    function resetOrgFilters() {
      document.getElementById('orgEventSearch').value = '';
      document.getElementById('orgCategoryFilter').value = 'all';
      document.getElementById('orgStatusFilter').value = 'all';
      renderOrganizerEvents();
    }

    async function togglePublishEvent(eventId, isPublished) {
      try {
        await EventifyApp.api(`/events/${eventId}`, {
          method: 'PUT',
          body: { isPublished, isDraft: !isPublished }
        });
        EventifyApp.showToast(isPublished ? 'Event published to public catalog!' : 'Event unpublished from public view', 'success');
        loadOrganizerEvents();
      } catch (err) {
        EventifyApp.showToast(err.message, 'error');
      }
    }

    async function changeEventStatus(eventId, status) {
      try {
        await EventifyApp.api(`/events/${eventId}`, {
          method: 'PUT',
          body: { status }
        });
        EventifyApp.showToast(`Event status updated to ${status}`, 'success');
        loadOrganizerEvents();
      } catch (err) {
        EventifyApp.showToast(err.message, 'error');
      }
    }

    async function deleteEvent(eventId) {
      if (!confirm('Are you sure you want to permanently delete this event?')) return;
      try {
        await EventifyApp.api(`/events/${eventId}`, { method: 'DELETE' });
        EventifyApp.showToast('Event deleted', 'success');
        loadOrganizerEvents();
      } catch (err) {
        EventifyApp.showToast(err.message, 'error');
      }
    }

    document.addEventListener('DOMContentLoaded', initManageEvents);
  </script>
</body>
</html>
