[build]
  publish = "frontend"
  command = "echo 'EVENTIFY Static Frontend Ready for Netlify Deployment'"

# When deploying frontend separately on Netlify and backend on Render,
# replace https://your-eventify-backend.onrender.com with your actual Render Web Service URL.
[[redirects]]
  from = "/api/*"
  to = "https://your-eventify-backend.onrender.com/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/uploads/*"
  to = "https://your-eventify-backend.onrender.com/uploads/:splat"
  status = 200
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

