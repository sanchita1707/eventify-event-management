
[build]
  base = "frontend"
  publish = "."

[[redirects]]
  from = "/api/*"
  to = "https://eventify-event-management.onrender.com/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/uploads/*"
  to = "https://eventify-event-management.onrender.com/uploads/:splat"
  status = 200
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
