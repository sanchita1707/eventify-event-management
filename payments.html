<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Monitor Payments – EVENTIFY Admin</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">
  <link href="/css/style.css" rel="stylesheet">
</head>
<body>
  <div id="ev-navbar-placeholder"></div>

  <div class="ev-dashboard-wrapper">
    <aside class="ev-sidebar" id="ev-admin-sidebar"></aside>

    <main class="ev-dashboard-main">
      <div class="mb-4">
        <span class="text-danger fw-bold small text-uppercase">Razorpay Ledger</span>
        <h3 class="mb-0">Monitor Payment Transactions</h3>
      </div>

      <div class="ev-card p-4 h-auto">
        <div class="table-responsive">
          <table class="table align-middle small mb-0">
            <thead class="table-light">
              <tr>
                <th>Razorpay Order ID</th>
                <th>Payment ID</th>
                <th>Customer</th>
                <th>Event</th>
                <th>Method</th>
                <th>Amount</th>
                <th>Status</th>
                <th>Date</th>
              </tr>
            </thead>
            <tbody id="adminPaymentsTable">
              <tr><td colspan="8" class="text-center py-4 text-muted">Loading transactions...</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/socket.io/socket.io.js"></script>
  <script src="/js/main.js"></script>
  <script src="/js/admin.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      const tbody = document.getElementById('adminPaymentsTable');
      try {
        const res = await EventifyApp.api('/admin/payments');
        const payments = res.payments || [];
        tbody.innerHTML = payments.map(p => `
          <tr>
            <td><code>${p.razorpayOrderId}</code></td>
            <td><code>${p.razorpayPaymentId || '—'}</code></td>
            <td>${p.user ? p.user.name : ''}</td>
            <td>${p.event ? p.event.title : ''}</td>
            <td class="text-uppercase fw-semibold">${p.paymentMethod || 'card'}</td>
            <td class="fw-bold text-success">${EventifyApp.formatCurrency(p.amount)}</td>
            <td>
              <span class="ev-badge ${p.status === 'captured' ? 'ev-badge-green' : p.status === 'failed' ? 'ev-badge-red' : 'ev-badge-amber'}">
                ${p.status.toUpperCase()}
              </span>
            </td>
            <td>${EventifyApp.formatDate(p.createdAt)}</td>
          </tr>
        `).join('');
      } catch (err) {
        EventifyApp.showToast(err.message, 'error');
      }
    });
  </script>
</body>
</html>
