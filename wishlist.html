<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Saved Wishlist – EVENTIFY</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">
  <link href="/css/style.css" rel="stylesheet">
</head>
<body>
  <div id="ev-navbar-placeholder"></div>

  <section class="py-4 bg-white border-bottom">
    <div class="container d-flex justify-content-between align-items-center">
      <div>
        <span class="text-primary fw-bold small text-uppercase">Favorite Events</span>
        <h2 class="mb-0">My Saved Wishlist</h2>
      </div>
      <a href="/events.html" class="btn-ev-outline btn-sm">Browse More Events</a>
    </div>
  </section>

  <section class="py-5">
    <div class="container">
      <div class="row g-4" id="wishlistGrid">
        <div class="col-12 text-center py-5">
          <div class="spinner-border text-primary"></div>
        </div>
      </div>
    </div>
  </section>

  <div id="ev-footer-placeholder"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/socket.io/socket.io.js"></script>
  <script src="/js/main.js"></script>
  <script>
    EventifyApp.requireAuth();

    async function loadWishlistPage() {
      const grid = document.getElementById('wishlistGrid');
      try {
        const res = await EventifyApp.api('/wishlist');
        const items = (res.wishlist || []).filter(i => i && i.event);

        if (items.length === 0) {
          grid.innerHTML = `
            <div class="col-12">
              <div class="ev-card p-5 text-center">
                <i class="fa-regular fa-heart fs-1 text-danger mb-3"></i>
                <h4>Your Wishlist is Empty</h4>
                <p class="text-muted small mb-4">Click the heart icon on any event card to save it here for quick booking later.</p>
                <div><a href="/events.html" class="btn-ev-primary">Discover Events</a></div>
              </div>
            </div>
          `;
          return;
        }

        const ids = items.map(i => i.event._id);
        grid.innerHTML = items.map(i => EventifyApp.renderEventCard(i.event, ids)).join('');
      } catch (err) {
        grid.innerHTML = `<div class="col-12 alert alert-danger">${err.message}</div>`;
      }
    }

    document.addEventListener('DOMContentLoaded', loadWishlistPage);
  </script>
</body>
</html>
