<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart QR Ticket – EVENTIFY</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">
  <link href="/css/style.css" rel="stylesheet">
  <style>
    @media print {
      #ev-navbar-placeholder, #ev-footer-placeholder, .no-print {
        display: none !important;
      }
      body {
        background: #fff !important;
      }
      .ev-ticket-pass {
        box-shadow: none !important;
        border: 2px solid #000 !important;
      }
    }
  </style>
</head>
<body>
  <div id="ev-navbar-placeholder"></div>

  <section class="py-5">
    <div class="container">
      <div class="d-flex flex-wrap justify-content-between align-items-center mb-4 no-print max-w-820 mx-auto" style="max-width:820px;">
        <div>
          <span class="ev-badge ev-badge-green mb-1"><i class="fa-solid fa-circle-check"></i> Official Verified e-Ticket</span>
          <h3 class="mb-0">Your Smart QR Event Pass</h3>
        </div>
        <div class="d-flex gap-2 mt-2 mt-sm-0">
          <button onclick="window.print()" class="btn-ev-primary btn-sm">
            <i class="fa-solid fa-download me-1"></i> Print / Save Ticket PDF
          </button>
          <a href="/my-bookings.html" class="btn-ev-outline btn-sm">My Bookings</a>
        </div>
      </div>

      <div id="ticketPassContainer">
        <div class="text-center py-5">
          <div class="spinner-border text-primary"></div>
        </div>
      </div>
    </div>
  </section>

  <div id="ev-footer-placeholder"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/socket.io/socket.io.js"></script>
  <script src="/js/main.js"></script>
  <script>
    EventifyApp.requireAuth();
    const urlParams = new URLSearchParams(window.location.search);
    const ticketId = urlParams.get('id');

    async function loadTicket() {
      if (!ticketId) {
        window.location.href = '/my-bookings.html';
        return;
      }

      try {
        const res = await EventifyApp.api(`/tickets/${ticketId}`);
        const t = res.ticket;
        const ev = t.event;
        const b = t.booking;

        const statusBadge = t.checkInStatus === 'checked_in'
          ? `<span class="badge bg-success px-3 py-2"><i class="fa-solid fa-user-check me-1"></i> Checked In at Venue (${new Date(t.checkedInAt).toLocaleTimeString()})</span>`
          : `<span class="badge bg-warning text-dark px-3 py-2"><i class="fa-solid fa-qrcode me-1"></i> Ready for Entry Scan (Unused)</span>`;

        document.getElementById('ticketPassContainer').innerHTML = `
          <div class="ev-ticket-pass">
            <div class="ev-ticket-header">
              <div>
                <div class="d-flex align-items-center gap-2 mb-1">
                  <i class="fa-solid fa-bolt text-warning"></i>
                  <span class="fw-bold small text-uppercase letter-spacing-1">EVENTIFY SMART QR PASS</span>
                </div>
                <h4 class="text-white mb-0">${ev.title}</h4>
              </div>
              <div class="text-md-end">
                ${statusBadge}
              </div>
            </div>

            <div class="ev-ticket-body">
              <div class="ev-ticket-info">
                <div class="row g-3 mb-4">
                  <div class="col-sm-6">
                    <span class="text-muted small d-block">Attendee Name</span>
                    <span class="fw-bold text-dark fs-6">${b.attendeeName}</span>
                  </div>
                  <div class="col-sm-6">
                    <span class="text-muted small d-block">Booking Reference</span>
                    <span class="fw-bold text-primary">${b.bookingReference}</span>
                  </div>
                  <div class="col-sm-6">
                    <span class="text-muted small d-block">Event Date & Time</span>
                    <span class="fw-bold text-dark">${EventifyApp.formatDate(ev.date)} • ${ev.startTime}</span>
                  </div>
                  <div class="col-sm-6">
                    <span class="text-muted small d-block">Venue & City</span>
                    <span class="fw-bold text-dark">${ev.venue}, ${ev.city}</span>
                  </div>
                  <div class="col-sm-6">
                    <span class="text-muted small d-block">Reserved Seat(s)</span>
                    <div class="d-flex flex-wrap gap-1 mt-1">
                      ${t.seats.map(s => `<span class="ev-badge ev-badge-purple fs-6">${s}</span>`).join('')}
                    </div>
                  </div>
                  <div class="col-sm-6">
                    <span class="text-muted small d-block">Amount Paid</span>
                    <span class="fw-bold text-success fs-5">${EventifyApp.formatCurrency(b.totalAmount)}</span>
                  </div>
                </div>

                <div class="p-3 rounded-3 bg-light border small text-secondary">
                  <div class="fw-bold text-dark mb-1"><i class="fa-solid fa-shield-halved text-primary me-1"></i> Smart Anti-Duplicate Verification</div>
                  <div>Cryptographic Signature Hash: <code>${t.qrPayloadHash}</code></div>
                  <div class="mt-1">Present this QR code to the Event Organizer at the entrance. Once scanned, duplicate entry is automatically blocked.</div>
                </div>

                ${ev.certificateEligible ? `
                  <div class="mt-3 no-print">
                    <button onclick="downloadCertificate('${b._id}')" class="btn-ev-lavender btn-sm w-100 py-2">
                      <i class="fa-solid fa-award me-1"></i> Download Official PDF Participation Certificate
                    </button>
                  </div>
                ` : ''}
              </div>

              <div class="ev-ticket-qr-section">
                <div class="bg-white p-3 rounded-4 shadow-sm border mb-3">
                  <img src="${t.qrCodeDataUrl}" alt="Smart QR Ticket" style="width:200px;height:200px;">
                </div>
                <div class="small text-muted">Unique Ticket ID</div>
                <div class="fs-5 fw-bold text-primary mb-2" id="ticketCodeText">${t.ticketCode}</div>
                <button class="btn btn-sm btn-outline-primary rounded-pill px-3 no-print" onclick="navigator.clipboard.writeText('${t.ticketCode}');EventifyApp.showToast('Ticket ID copied!','info')">
                  <i class="fa-regular fa-copy me-1"></i> Copy Ticket ID
                </button>
              </div>
            </div>
          </div>
        `;
      } catch (err) {
        document.getElementById('ticketPassContainer').innerHTML = `
          <div class="alert alert-danger text-center">${err.message}</div>
        `;
      }
    }

    async function downloadCertificate(bookingId) {
      try {
        EventifyApp.showToast('Generating your official PDF certificate...', 'info');
        const blob = await EventifyApp.api(`/certificates/download/${bookingId}`);
        const url = window.URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `EVENTIFY-Certificate-${bookingId}.pdf`;
        document.body.appendChild(a);
        a.click();
        a.remove();
        window.URL.revokeObjectURL(url);
        EventifyApp.showToast('Certificate PDF downloaded!', 'success');
      } catch (err) {
        EventifyApp.showToast(err.message, 'error');
      }
    }

    document.addEventListener('DOMContentLoaded', loadTicket);
  </script>
</body>
</html>
