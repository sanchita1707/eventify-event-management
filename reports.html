<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>System Reports & Analytics – EVENTIFY Admin</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">
  <link href="/css/style.css" rel="stylesheet">
</head>
<body>
  <div id="ev-navbar-placeholder"></div>

  <div class="ev-dashboard-wrapper">
    <aside class="ev-sidebar" id="ev-admin-sidebar"></aside>

    <main class="ev-dashboard-main">
      <div class="d-flex flex-wrap justify-content-between align-items-center mb-4">
        <div>
          <span class="text-danger fw-bold small text-uppercase">Executive Reporting</span>
          <h3 class="mb-0">Website Analytics & Financial Reports</h3>
        </div>
        <div class="d-flex gap-2">
          <button onclick="exportReportCSV()" class="btn-ev-primary btn-sm">
            <i class="fa-solid fa-file-csv me-1"></i> Export Financial Report CSV
          </button>
          <button onclick="window.print()" class="btn-ev-outline btn-sm">
            <i class="fa-solid fa-print me-1"></i> Print Executive Report
          </button>
        </div>
      </div>

      <div class="ev-card p-4 h-auto mb-4">
        <h5 class="fw-bold mb-3">Event Performance & Revenue Audit Table</h5>
        <div class="table-responsive">
          <table class="table align-middle small mb-0">
            <thead class="table-light">
              <tr>
                <th>Event Title</th>
                <th>Category</th>
                <th>City</th>
                <th>Ticket Price</th>
                <th>Capacity</th>
                <th>Tickets Sold</th>
                <th>Available</th>
                <th>Rating</th>
              </tr>
            </thead>
            <tbody id="adminReportTable"></tbody>
          </table>
        </div>
      </div>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/socket.io/socket.io.js"></script>
  <script src="/js/main.js"></script>
  <script src="/js/admin.js"></script>
  <script>
    let reportEvents = [];

    document.addEventListener('DOMContentLoaded', async () => {
      try {
        const res = await EventifyApp.api('/admin/dashboard');
        reportEvents = res.popularEvents || [];

        document.getElementById('adminReportTable').innerHTML = reportEvents.map(e => `
          <tr>
            <td class="fw-bold text-dark">${e.title}</td>
            <td>${e.categoryName}</td>
            <td>${e.city}</td>
            <td>${EventifyApp.formatCurrency(e.ticketPrice)}</td>
            <td>${e.capacity}</td>
            <td class="fw-bold text-primary">${e.bookingsCount}</td>
            <td>${e.availableSeats}</td>
            <td class="text-warning fw-bold">★ ${e.averageRating}</td>
          </tr>
        `).join('');
      } catch (err) {
        EventifyApp.showToast(err.message, 'error');
      }
    });

    function exportReportCSV() {
      const headers = ['Event Title', 'Category', 'City', 'Base Price', 'Capacity', 'Tickets Sold', 'Available Seats', 'Rating'];
      const rows = reportEvents.map(e => [
        `"${e.title.replace(/"/g, '""')}"`,
        `"${e.categoryName}"`,
        e.city,
        e.ticketPrice,
        e.capacity,
        e.bookingsCount,
        e.availableSeats,
        e.averageRating
      ].join(','));

      const csv = 'data:text/csv;charset=utf-8,' + [headers.join(','), ...rows].join('\n');
      const link = document.createElement('a');
      link.setAttribute('href', encodeURI(csv));
      link.setAttribute('download', `EVENTIFY-Admin-Report-${Date.now()}.csv`);
      document.body.appendChild(link);
      link.click();
      link.remove();
      EventifyApp.showToast('Report exported as CSV!', 'success');
    }
  </script>
</body>
</html>
