<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Participants & Export List – EVENTIFY Organizer Studio</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">
  <link href="/css/style.css" rel="stylesheet">
</head>
<body>
  <div id="ev-navbar-placeholder"></div>

  <div class="ev-dashboard-wrapper">
    <aside class="ev-sidebar" id="ev-organizer-sidebar"></aside>

    <main class="ev-dashboard-main">
      <div class="d-flex flex-wrap justify-content-between align-items-center mb-4">
        <div>
          <span class="text-primary fw-bold small text-uppercase">Attendee Roster</span>
          <h3 class="mb-0">Participants & CSV Download</h3>
        </div>
        <div class="d-flex gap-2">
          <select id="partEventFilter" class="form-select form-select-sm" style="min-width:220px;">
            <option value="">All Events</option>
          </select>
          <button onclick="exportParticipantsCSV()" class="btn-ev-primary btn-sm">
            <i class="fa-solid fa-file-csv me-1"></i> Download Participant List (CSV)
          </button>
        </div>
      </div>

      <div class="ev-card p-4 h-auto">
        <div class="table-responsive">
          <table class="table align-middle small mb-0">
            <thead class="table-light">
              <tr>
                <th>Participant Name</th>
                <th>Email & Phone</th>
                <th>Event</th>
                <th>Ticket ID</th>
                <th>Seats</th>
                <th>Check-In Status</th>
                <th>Checked-In Time</th>
              </tr>
            </thead>
            <tbody id="participantsTableBody">
              <tr><td colspan="7" class="text-center py-4 text-muted">Loading participants...</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/socket.io/socket.io.js"></script>
  <script src="/js/main.js"></script>
  <script src="/js/organizer.js"></script>
  <script>
    let currentParticipants = [];

    async function initParticipantsPage() {
      const evRes = await EventifyApp.api('/organizer/events');
      const select = document.getElementById('partEventFilter');
      (evRes.events || []).forEach(e => {
        const opt = document.createElement('option');
        opt.value = e._id;
        opt.textContent = e.title;
        select.appendChild(opt);
      });

      select.addEventListener('change', () => loadParticipants(select.value));
      loadParticipants('');
    }

    async function loadParticipants(eventId = '') {
      const tbody = document.getElementById('participantsTableBody');
      try {
        const query = eventId ? `?eventId=${eventId}&status=confirmed` : '?status=confirmed';
        const res = await EventifyApp.api(`/organizer/bookings${query}`);
        currentParticipants = res.bookings || [];

        if (currentParticipants.length === 0) {
          tbody.innerHTML = `<tr><td colspan="7" class="text-center py-4 text-muted">No confirmed participants found.</td></tr>`;
          return;
        }

        tbody.innerHTML = currentParticipants.map(b => {
          const t = b.ticketId || {};
          const seats = (b.selectedSeats || []).map(s => s.seatNumber).join(', ');
          return `
            <tr>
              <td class="fw-bold text-dark">${b.attendeeName}</td>
              <td>
                <div>${b.attendeeEmail}</div>
                <div class="text-muted" style="font-size:0.75rem;">${b.attendeePhone || ''}</div>
              </td>
              <td>${b.event ? b.event.title : ''}</td>
              <td><code class="fw-bold">${t.ticketCode || 'N/A'}</code></td>
              <td><span class="ev-badge ev-badge-purple">${seats}</span></td>
              <td>
                <span class="ev-badge ${t.checkInStatus === 'checked_in' ? 'ev-badge-green' : 'ev-badge-amber'}">
                  <i class="fa-solid ${t.checkInStatus === 'checked_in' ? 'fa-user-check' : 'fa-clock'}"></i>
                  ${t.checkInStatus === 'checked_in' ? 'Checked In' : 'Not Checked In'}
                </span>
              </td>
              <td class="text-muted">${t.checkedInAt ? new Date(t.checkedInAt).toLocaleString() : '—'}</td>
            </tr>
          `;
        }).join('');
      } catch (err) {
        EventifyApp.showToast(err.message, 'error');
      }
    }

    function exportParticipantsCSV() {
      if (currentParticipants.length === 0) {
        EventifyApp.showToast('No participants to export', 'warning');
        return;
      }

      const headers = ['Booking Ref', 'Ticket Code', 'Participant Name', 'Email', 'Phone', 'Event Title', 'Seats', 'Amount Paid', 'Check-In Status', 'Checked-In At'];
      const rows = currentParticipants.map(b => {
        const t = b.ticketId || {};
        const seats = (b.selectedSeats || []).map(s => s.seatNumber).join(' ');
        return [
          b.bookingReference,
          t.ticketCode || '',
          `"${(b.attendeeName || '').replace(/"/g, '""')}"`,
          b.attendeeEmail,
          b.attendeePhone || '',
          `"${(b.event ? b.event.title : '').replace(/"/g, '""')}"`,
          `"${seats}"`,
          b.totalAmount,
          t.checkInStatus || 'unused',
          t.checkedInAt ? new Date(t.checkedInAt).toISOString() : ''
        ].join(',');
      });

      const csvContent = 'data:text/csv;charset=utf-8,' + [headers.join(','), ...rows].join('\n');
      const encodedUri = encodeURI(csvContent);
      const link = document.createElement('a');
      link.setAttribute('href', encodedUri);
      link.setAttribute('download', `EVENTIFY-Participants-${Date.now()}.csv`);
      document.body.appendChild(link);
      link.click();
      link.remove();
      EventifyApp.showToast('Participant list exported as CSV!', 'success');
    }

    document.addEventListener('DOMContentLoaded', initParticipantsPage);
  </script>
</body>
</html>
