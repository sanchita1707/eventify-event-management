<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Organizer Analytics – EVENTIFY</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">
  <link href="/css/style.css" rel="stylesheet">
</head>
<body>
  <div id="ev-navbar-placeholder"></div>

  <div class="ev-dashboard-wrapper">
    <aside class="ev-sidebar" id="ev-organizer-sidebar"></aside>

    <main class="ev-dashboard-main">
      <div class="mb-4">
        <span class="text-primary fw-bold small text-uppercase">Real-Time Intelligence</span>
        <h3 class="mb-0">Event Revenue & Booking Analytics</h3>
      </div>

      <div class="row g-4 mb-4">
        <div class="col-lg-6">
          <div class="ev-card p-4 h-auto">
            <h6 class="fw-bold mb-3">Monthly Revenue Trend (₹)</h6>
            <canvas id="monthlyRevenueChart" height="160"></canvas>
          </div>
        </div>
        <div class="col-lg-6">
          <div class="ev-card p-4 h-auto">
            <h6 class="fw-bold mb-3">Tickets Sold vs Remaining Capacity per Event</h6>
            <canvas id="capacityComparisonChart" height="160"></canvas>
          </div>
        </div>
      </div>

      <div class="ev-card p-4 h-auto">
        <h6 class="fw-bold mb-3">Event-Wise Financial Breakdown</h6>
        <div class="table-responsive">
          <table class="table align-middle small mb-0">
            <thead class="table-light">
              <tr>
                <th>Event Title</th>
                <th>Total Capacity</th>
                <th>Tickets Sold</th>
                <th>Available Seats</th>
                <th>Occupancy %</th>
                <th>Total Revenue</th>
              </tr>
            </thead>
            <tbody id="analyticsBreakdownTable"></tbody>
          </table>
        </div>
      </div>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
  <script src="/socket.io/socket.io.js"></script>
  <script src="/js/main.js"></script>
  <script src="/js/organizer.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      try {
        const res = await EventifyApp.api('/organizer/dashboard');
        const monthly = res.monthlyStats || [];
        const perf = res.eventPerformance || [];

        new Chart(document.getElementById('monthlyRevenueChart'), {
          type: 'line',
          data: {
            labels: monthly.map(m => m.month),
            datasets: [{
              label: 'Monthly Revenue (₹)',
              data: monthly.map(m => m.revenue),
              borderColor: '#6C3CE9',
              backgroundColor: 'rgba(108, 60, 233, 0.12)',
              fill: true,
              tension: 0.35
            }]
          }
        });

        new Chart(document.getElementById('capacityComparisonChart'), {
          type: 'bar',
          data: {
            labels: perf.map(p => p.title.slice(0, 18) + '...'),
            datasets: [
              { label: 'Tickets Sold', data: perf.map(p => p.ticketsSold), backgroundColor: '#10B981' },
              { label: 'Available Seats', data: perf.map(p => p.availableSeats), backgroundColor: '#C4B5FD' }
            ]
          }
        });

        document.getElementById('analyticsBreakdownTable').innerHTML = perf.map(p => {
          const occ = p.capacity > 0 ? Math.round((p.ticketsSold / p.capacity) * 100) : 0;
          return `
            <tr>
              <td class="fw-bold text-dark">${p.title}</td>
              <td>${p.capacity}</td>
              <td class="fw-semibold text-primary">${p.ticketsSold}</td>
              <td>${p.availableSeats}</td>
              <td>
                <div class="progress" style="height:8px;width:100px;">
                  <div class="progress-bar bg-primary" style="width:${occ}%"></div>
                </div>
                <span class="text-muted" style="font-size:0.72rem;">${occ}%</span>
              </td>
              <td class="fw-bold text-success">${EventifyApp.formatCurrency(p.revenue)}</td>
            </tr>
          `;
        }).join('');
      } catch (err) {
        EventifyApp.showToast(err.message, 'error');
      }
    });
  </script>
</body>
</html>
