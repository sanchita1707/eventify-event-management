<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Browse Event Categories – EVENTIFY</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">
  <link href="/css/style.css" rel="stylesheet">
</head>
<body>
  <div id="ev-navbar-placeholder"></div>

  <section class="py-5 bg-white border-bottom">
    <div class="container text-center">
      <span class="ev-badge ev-badge-purple mb-2"><i class="fa-solid fa-layer-group"></i> Curated Experiences</span>
      <h1>Explore Events by Category</h1>
      <p class="text-muted max-w-600 mx-auto mb-0">
        Select any category below to filter upcoming conferences, live concerts, hands-on bootcamps, and college festivals.
      </p>
    </div>
  </section>

  <section class="py-5">
    <div class="container">
      <div class="row g-4" id="categoriesFullGrid">
        <div class="col-12 text-center py-5 text-muted">Loading categories...</div>
      </div>
    </div>
  </section>

  <div id="ev-footer-placeholder"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/socket.io/socket.io.js"></script>
  <script src="/js/main.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      try {
        const res = await EventifyApp.api('/categories');
        const categories = res.categories || [];
        const grid = document.getElementById('categoriesFullGrid');

        grid.innerHTML = categories.map(c => {
          const count = Number(c.eventCount) || 0;
          const countLabel = count === 1 ? '1 Active Event' : `${count} Active Events`;
          return `
          <div class="col-12 col-md-6 col-lg-4 d-flex">
            <div class="ev-card p-4 w-100" style="cursor:pointer;" onclick="window.location.href='/events.html?category=${encodeURIComponent(c.name)}'">
              <div class="d-flex align-items-center justify-content-between mb-3">
                <div class="ev-category-icon mb-0">
                  <i class="fa-solid ${c.icon || 'fa-calendar-star'}"></i>
                </div>
                <span class="ev-badge ev-badge-purple">${countLabel}</span>
              </div>
              <h5 class="fw-bold mb-2">${c.name}</h5>
              <p class="text-secondary small mb-3">${c.description || 'Discover top-rated live events in this category.'}</p>
              <div class="mt-auto pt-2 border-top d-flex justify-content-between align-items-center">
                <span class="small fw-semibold text-primary">Browse Category</span>
                <i class="fa-solid fa-arrow-right text-primary"></i>
              </div>
            </div>
          </div>
        `;
        }).join('');
      } catch (err) {
        EventifyApp.showToast(err.message, 'error');
      }
    });
  </script>
</body>
</html>
