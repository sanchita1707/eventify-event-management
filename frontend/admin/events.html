<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Approve & Manage Events – EVENTIFY Admin</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">
  <link href="/css/style.css" rel="stylesheet">
</head>
<body>
  <div id="ev-navbar-placeholder"></div>

  <div class="ev-dashboard-wrapper">
    <aside class="ev-sidebar" id="ev-admin-sidebar"></aside>

    <main class="ev-dashboard-main">
      <div class="mb-4">
        <span class="text-danger fw-bold small text-uppercase">Event Moderation</span>
        <h3 class="mb-0">Approve, Reject & Manage Events</h3>
      </div>

      <!-- Search & Approval Filter Bar -->
      <div class="ev-card p-3 mb-4 h-auto">
        <div class="row g-2 align-items-center">
          <div class="col-md-6">
            <div class="input-group input-group-sm">
              <span class="input-group-text bg-white border-end-0"><i class="fa-solid fa-magnifying-glass text-primary"></i></span>
              <input type="text" id="eventSearchInput" class="form-control border-start-0" placeholder="Search by event title, organizer, category, or city...">
            </div>
          </div>
          <div class="col-md-4">
            <select id="eventApprovalFilter" class="form-select form-select-sm">
              <option value="all">All Approval Statuses</option>
              <option value="pending">Pending Approval</option>
              <option value="approved">Approved</option>
              <option value="rejected">Rejected</option>
            </select>
          </div>
          <div class="col-md-2">
            <button type="button" onclick="resetEventFilters()" class="btn-ev-outline btn-sm w-100 justify-content-center">Reset</button>
          </div>
        </div>
      </div>

      <div class="ev-card p-4 h-auto">
        <div class="table-responsive">
          <table class="table align-middle small mb-0">
            <thead class="table-light">
              <tr>
                <th>Event</th>
                <th>Organizer</th>
                <th>Date & City</th>
                <th>Price</th>
                <th>Featured / Trending</th>
                <th>Approval Status</th>
                <th class="text-end">Moderation</th>
              </tr>
            </thead>
            <tbody id="adminEventsTable">
              <tr><td colspan="7" class="text-center py-4 text-muted">Loading events...</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </main>
  </div>

  <!-- Inspect Event Details & Poster Modal -->
  <div class="modal fade" id="inspectEventModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-centered">
      <div class="modal-content border-0 shadow-lg" style="border-radius:18px;">
        <div class="modal-header border-bottom-0 pb-0">
          <h5 class="modal-title fw-bold"><i class="fa-solid fa-magnifying-glass-chart text-primary me-2"></i>Event Submission Details & Poster Preview</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body p-4" id="inspectEventModalBody"></div>
      </div>
    </div>
  </div>

  <!-- Reject Event with Reason Modal -->
  <div class="modal fade" id="rejectEventModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content border-0 shadow-lg" style="border-radius:18px;">
        <div class="modal-header border-bottom-0 pb-0">
          <h5 class="modal-title fw-bold text-danger"><i class="fa-solid fa-circle-xmark me-2"></i>Reject Event Submission</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body p-4">
          <form onsubmit="confirmRejectEvent(event)">
            <input type="hidden" id="rejectEventIdInput">
            <div class="mb-3">
              <label class="form-label small fw-semibold">Reason for Rejection (Sent to Organizer) *</label>
              <textarea id="rejectReasonInput" class="form-control" rows="3" placeholder="Explain what the organizer needs to fix (e.g., incomplete venue address, unclear poster image)..." required></textarea>
            </div>
            <div class="d-flex justify-content-end gap-2">
              <button type="button" class="btn btn-light btn-sm" data-bs-dismiss="modal">Cancel</button>
              <button type="submit" class="btn btn-danger btn-sm">Confirm Rejection & Notify Organizer</button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/socket.io/socket.io.js"></script>
  <script src="/js/main.js"></script>
  <script src="/js/admin.js"></script>
  <script>
    let allEventsCache = [];

    async function loadAdminEvents() {
      const tbody = document.getElementById('adminEventsTable');
      try {
        const res = await EventifyApp.api('/admin/events');
        allEventsCache = res.events || [];
        renderAdminEvents();
      } catch (err) {
        EventifyApp.showToast(err.message, 'error');
      }
    }

    function renderAdminEvents() {
      const tbody = document.getElementById('adminEventsTable');
      const q = (document.getElementById('eventSearchInput').value || '').trim().toLowerCase();
      const statusFilter = document.getElementById('eventApprovalFilter').value;

      const filtered = allEventsCache.filter(e => {
        const matchQ = !q ||
          (e.title && e.title.toLowerCase().includes(q)) ||
          (e.organizerName && e.organizerName.toLowerCase().includes(q)) ||
          (e.categoryName && e.categoryName.toLowerCase().includes(q)) ||
          (e.city && e.city.toLowerCase().includes(q));
        const matchStatus = statusFilter === 'all' || e.approvalStatus === statusFilter;
        return matchQ && matchStatus;
      });

      if (filtered.length === 0) {
        tbody.innerHTML = `<tr><td colspan="7" class="text-center py-4 text-muted">No matching events found.</td></tr>`;
        return;
      }

      tbody.innerHTML = filtered.map(e => `
        <tr>
          <td>
            <div class="d-flex align-items-center gap-3">
              <img src="${e.poster}" class="rounded-2 border" style="width:58px;height:42px;object-fit:cover;cursor:pointer;" onclick="openEventInspectModal('${e._id}')" title="Click to preview poster & full details">
              <div>
                <a href="/event-details.html?id=${e._id}" class="fw-bold text-dark d-block">${e.title}</a>
                <span class="text-muted" style="font-size:0.72rem;">${e.categoryName} • ${e.availableSeats}/${e.capacity} seats</span>
              </div>
            </div>
          </td>
          <td>
            <div class="fw-semibold text-dark">${e.organizerName || 'Organizer'}</div>
            <div class="text-muted" style="font-size:0.72rem;">${e.organizer && e.organizer.email ? e.organizer.email : ''}</div>
          </td>
          <td>
            <div>${EventifyApp.formatDate(e.date)}</div>
            <div class="text-muted" style="font-size:0.72rem;">${e.venue || ''}, ${e.city}</div>
          </td>
          <td>
            <div class="fw-bold">${EventifyApp.formatCurrency(e.ticketPrice)}</div>
            <div class="text-muted" style="font-size:0.72rem;">VIP: ${EventifyApp.formatCurrency(e.vipPrice || e.ticketPrice * 2)}</div>
          </td>
          <td>
            <div class="form-check form-switch mb-1">
              <input class="form-check-input" type="checkbox" ${e.isFeatured ? 'checked' : ''} onchange="updateEventFlags('${e._id}', { isFeatured: this.checked })">
              <label class="form-check-label" style="font-size:0.75rem;">Featured</label>
            </div>
            <div class="form-check form-switch">
              <input class="form-check-input" type="checkbox" ${e.isTrending ? 'checked' : ''} onchange="updateEventFlags('${e._id}', { isTrending: this.checked })">
              <label class="form-check-label" style="font-size:0.75rem;">Trending</label>
            </div>
          </td>
          <td>
            <span class="ev-badge ${e.approvalStatus === 'approved' ? 'ev-badge-green' : e.approvalStatus === 'pending' ? 'ev-badge-amber' : 'ev-badge-red'}">
              ${e.approvalStatus.toUpperCase()}
            </span>
            ${e.approvalStatus === 'rejected' && e.rejectionReason ? `
              <div class="text-danger mt-1" style="font-size:0.72rem;max-width:180px;">Reason: ${e.rejectionReason}</div>
            ` : ''}
          </td>
          <td class="text-end">
            <div class="btn-group btn-group-sm">
              <button onclick="openEventInspectModal('${e._id}')" class="btn btn-outline-secondary" title="Inspect Details & Poster">
                <i class="fa-regular fa-eye"></i>
              </button>
              <button onclick="updateEventFlags('${e._id}', { approvalStatus: 'approved' })" class="btn btn-success" title="Approve Event">
                <i class="fa-solid fa-check"></i> Approve
              </button>
              <button onclick="openRejectModal('${e._id}')" class="btn btn-outline-danger" title="Reject Event with Reason">
                <i class="fa-solid fa-xmark"></i> Reject
              </button>
            </div>
          </td>
        </tr>
      `).join('');
    }

    function openEventInspectModal(eventId) {
      const ev = allEventsCache.find(x => x._id === eventId);
      if (!ev) return;
      const body = document.getElementById('inspectEventModalBody');
      body.innerHTML = `
        <div class="row g-3">
          <div class="col-md-5">
            <img src="${ev.poster}" class="w-100 rounded-3 border" style="height:210px;object-fit:cover;" alt="${ev.title}">
            <div class="mt-2 d-flex flex-wrap gap-1">
              <span class="ev-badge ev-badge-purple">${ev.categoryName}</span>
              <span class="ev-badge ${ev.approvalStatus === 'approved' ? 'ev-badge-green' : ev.approvalStatus === 'pending' ? 'ev-badge-amber' : 'ev-badge-red'}">${ev.approvalStatus.toUpperCase()}</span>
            </div>
          </div>
          <div class="col-md-7">
            <h5 class="fw-bold mb-1">${ev.title}</h5>
            <p class="text-muted small mb-2">Organized by <strong>${ev.organizerName}</strong> (${ev.organizer && ev.organizer.email ? ev.organizer.email : 'Verified Organizer'})</p>
            <div class="small mb-2">
              <div><strong>Date & Time:</strong> ${EventifyApp.formatDate(ev.date)} • ${ev.startTime || '18:00'} - ${ev.endTime || '21:00'}</div>
              <div><strong>Venue & Address:</strong> ${ev.venue}, ${ev.address || ''}, ${ev.city}</div>
              <div><strong>Pricing:</strong> Standard ${EventifyApp.formatCurrency(ev.ticketPrice)} | Premium ${EventifyApp.formatCurrency(ev.premiumPrice || ev.ticketPrice * 1.5)} | VIP ${EventifyApp.formatCurrency(ev.vipPrice || ev.ticketPrice * 2)}</div>
              <div><strong>Capacity:</strong> ${ev.availableSeats} / ${ev.capacity} available (Max ${ev.maxTicketsPerCustomer || 10} per customer)</div>
            </div>
            <p class="small text-secondary border-top pt-2 mb-2">${ev.description}</p>
            ${ev.termsAndConditions ? `<div class="small text-muted border-top pt-2"><strong>Terms:</strong> ${ev.termsAndConditions}</div>` : ''}
          </div>
        </div>
        <div class="mt-3 pt-3 border-top d-flex justify-content-end gap-2">
          <button type="button" class="btn btn-sm btn-success" onclick="updateEventFlags('${ev._id}', { approvalStatus: 'approved' }); bootstrap.Modal.getInstance(document.getElementById('inspectEventModal')).hide();">
            <i class="fa-solid fa-check me-1"></i> Approve & Publish Event
          </button>
          <button type="button" class="btn btn-sm btn-outline-danger" onclick="bootstrap.Modal.getInstance(document.getElementById('inspectEventModal')).hide(); openRejectModal('${ev._id}');">
            <i class="fa-solid fa-xmark me-1"></i> Reject Event
          </button>
        </div>
      `;
      new bootstrap.Modal(document.getElementById('inspectEventModal')).show();
    }

    function openRejectModal(eventId) {
      document.getElementById('rejectEventIdInput').value = eventId;
      document.getElementById('rejectReasonInput').value = '';
      new bootstrap.Modal(document.getElementById('rejectEventModal')).show();
    }

    async function confirmRejectEvent(e) {
      e.preventDefault();
      const eventId = document.getElementById('rejectEventIdInput').value;
      const reason = document.getElementById('rejectReasonInput').value.trim() || 'Does not meet platform event guidelines.';
      await updateEventFlags(eventId, { approvalStatus: 'rejected', rejectionReason: reason });
      const modalEl = document.getElementById('rejectEventModal');
      const modalInstance = bootstrap.Modal.getInstance(modalEl);
      if (modalInstance) modalInstance.hide();
    }

    function resetEventFilters() {
      document.getElementById('eventSearchInput').value = '';
      document.getElementById('eventApprovalFilter').value = 'all';
      renderAdminEvents();
    }

    async function updateEventFlags(eventId, payload) {
      try {
        const res = await EventifyApp.api(`/admin/events/${eventId}/approval`, {
          method: 'PUT',
          body: payload
        });
        EventifyApp.showToast(res.message, 'success');
        loadAdminEvents();
      } catch (err) {
        EventifyApp.showToast(err.message, 'error');
      }
    }

    document.addEventListener('DOMContentLoaded', () => {
      const params = new URLSearchParams(window.location.search);
      if (params.get('filter') === 'pending') {
        document.getElementById('eventApprovalFilter').value = 'pending';
      }
      loadAdminEvents();
      document.getElementById('eventSearchInput').addEventListener('input', renderAdminEvents);
      document.getElementById('eventApprovalFilter').addEventListener('change', renderAdminEvents);
    });
  </script>
</body>
</html>
