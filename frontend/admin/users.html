<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manage Users – EVENTIFY Admin</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">
  <link href="/css/style.css" rel="stylesheet">
</head>
<body>
  <div id="ev-navbar-placeholder"></div>

  <div class="ev-dashboard-wrapper">
    <aside class="ev-sidebar" id="ev-admin-sidebar"></aside>

    <main class="ev-dashboard-main">
      <div class="d-flex flex-wrap justify-content-between align-items-center mb-4">
        <div>
          <span class="text-danger fw-bold small text-uppercase">User Directory</span>
          <h3 class="mb-0">Manage Registered Users</h3>
        </div>
      </div>

      <!-- Search & Filter Controls -->
      <div class="ev-card p-3 mb-4 h-auto">
        <div class="row g-2 align-items-center">
          <div class="col-md-6">
            <div class="input-group input-group-sm">
              <span class="input-group-text bg-white border-end-0"><i class="fa-solid fa-magnifying-glass text-primary"></i></span>
              <input type="text" id="userSearchInput" class="form-control border-start-0" placeholder="Search by name, email, phone, or city...">
            </div>
          </div>
          <div class="col-md-3">
            <select id="userRoleSelect" class="form-select form-select-sm">
              <option value="all">All Roles</option>
              <option value="customer">Customer</option>
              <option value="organizer">Organizer</option>
              <option value="admin">Admin</option>
            </select>
          </div>
          <div class="col-md-3">
            <select id="userStatusSelect" class="form-select form-select-sm">
              <option value="all">All Statuses</option>
              <option value="active">Active</option>
              <option value="suspended">Suspended</option>
            </select>
          </div>
        </div>
      </div>

      <div class="ev-card p-4 h-auto">
        <div class="table-responsive">
          <table class="table align-middle small mb-0">
            <thead class="table-light">
              <tr>
                <th>Name & Email</th>
                <th>Phone & City</th>
                <th>Role</th>
                <th>Account Status</th>
                <th>Joined Date</th>
                <th class="text-end">Actions</th>
              </tr>
            </thead>
            <tbody id="adminUsersTable">
              <tr><td colspan="6" class="text-center py-4 text-muted">Loading users...</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/socket.io/socket.io.js"></script>
  <script src="/js/main.js"></script>
  <script src="/js/admin.js"></script>
  <script>
    let allUsersCache = [];

    async function loadUsers() {
      const tbody = document.getElementById('adminUsersTable');
      try {
        const res = await EventifyApp.api('/admin/users');
        allUsersCache = res.users || [];
        renderUsersTable();
      } catch (err) {
        EventifyApp.showToast(err.message, 'error');
      }
    }

    function renderUsersTable() {
      const tbody = document.getElementById('adminUsersTable');
      const q = (document.getElementById('userSearchInput').value || '').trim().toLowerCase();
      const roleFilter = document.getElementById('userRoleSelect').value;
      const statusFilter = document.getElementById('userStatusSelect').value;

      const filtered = allUsersCache.filter(u => {
        const matchQ = !q ||
          (u.name && u.name.toLowerCase().includes(q)) ||
          (u.email && u.email.toLowerCase().includes(q)) ||
          (u.phone && u.phone.toLowerCase().includes(q)) ||
          (u.city && u.city.toLowerCase().includes(q));
        const matchRole = roleFilter === 'all' || u.role === roleFilter;
        const matchStatus = statusFilter === 'all' ||
          (statusFilter === 'active' && u.isActive) ||
          (statusFilter === 'suspended' && !u.isActive);
        return matchQ && matchRole && matchStatus;
      });

      if (filtered.length === 0) {
        tbody.innerHTML = `<tr><td colspan="6" class="text-center py-4 text-muted">No matching users found.</td></tr>`;
        return;
      }

      tbody.innerHTML = filtered.map(u => `
        <tr>
          <td>
            <div class="fw-bold text-dark">${u.name}</div>
            <div class="text-muted" style="font-size:0.75rem;">${u.email}</div>
          </td>
          <td>
            <div>${u.phone || '—'}</div>
            <div class="text-muted" style="font-size:0.75rem;">${u.city || ''}</div>
          </td>
          <td>
            <span class="ev-badge ${u.role === 'admin' ? 'ev-badge-red' : u.role === 'organizer' ? 'ev-badge-purple' : 'ev-badge-blue'}">
              ${u.role.toUpperCase()}
            </span>
          </td>
          <td>
            <span class="ev-badge ${u.isActive ? 'ev-badge-green' : 'ev-badge-red'}">
              ${u.isActive ? 'Active' : 'Suspended'}
            </span>
          </td>
          <td>${EventifyApp.formatDate(u.createdAt)}</td>
          <td class="text-end">
            ${u.role !== 'admin' ? `
              <button onclick="toggleUserActive('${u._id}', ${!u.isActive})" class="btn btn-sm ${u.isActive ? 'btn-outline-warning' : 'btn-outline-success'} me-1">
                ${u.isActive ? 'Suspend' : 'Activate'}
              </button>
              <button onclick="deleteUser('${u._id}')" class="btn btn-sm btn-outline-danger">
                <i class="fa-solid fa-trash"></i>
              </button>
            ` : '<span class="text-muted small">System Admin</span>'}
          </td>
        </tr>
      `).join('');
    }

    async function toggleUserActive(id, isActive) {
      try {
        const res = await EventifyApp.api(`/admin/users/${id}`, {
          method: 'PUT',
          body: { isActive }
        });
        EventifyApp.showToast(res.message, 'success');
        loadUsers();
      } catch (err) {
        EventifyApp.showToast(err.message, 'error');
      }
    }

    async function deleteUser(id) {
      if (!confirm('Delete this user account permanently?')) return;
      try {
        await EventifyApp.api(`/admin/users/${id}`, { method: 'DELETE' });
        EventifyApp.showToast('User removed', 'success');
        loadUsers();
      } catch (err) {
        EventifyApp.showToast(err.message, 'error');
      }
    }

    document.addEventListener('DOMContentLoaded', () => {
      loadUsers();
      document.getElementById('userSearchInput').addEventListener('input', renderUsersTable);
      document.getElementById('userRoleSelect').addEventListener('change', renderUsersTable);
      document.getElementById('userStatusSelect').addEventListener('change', renderUsersTable);
    });
  </script>
</body>
</html>
