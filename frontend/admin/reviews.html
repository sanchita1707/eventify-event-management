<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manage Reviews & Complaints – EVENTIFY Admin</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">
  <link href="/css/style.css" rel="stylesheet">
</head>
<body>
  <div id="ev-navbar-placeholder"></div>

  <div class="ev-dashboard-wrapper">
    <aside class="ev-sidebar" id="ev-admin-sidebar"></aside>

    <main class="ev-dashboard-main">
      <div class="mb-4">
        <span class="text-danger fw-bold small text-uppercase">Trust & Safety</span>
        <h3 class="mb-0">Manage Reviews & Customer Complaints</h3>
      </div>

      <!-- Complaints Section -->
      <div class="ev-card p-4 h-auto mb-4">
        <h5 class="fw-bold mb-3"><i class="fa-solid fa-headset text-primary me-2"></i>Support Inquiries & Complaints</h5>
        <div class="table-responsive">
          <table class="table align-middle small mb-0">
            <thead class="table-light">
              <tr>
                <th>Sender</th>
                <th>Category & Subject</th>
                <th>Message</th>
                <th>Status</th>
                <th class="text-end">Action</th>
              </tr>
            </thead>
            <tbody id="adminComplaintsTable"></tbody>
          </table>
        </div>
      </div>

      <!-- Reviews Section -->
      <div class="ev-card p-4 h-auto">
        <h5 class="fw-bold mb-3"><i class="fa-solid fa-star text-warning me-2"></i>Event Reviews Moderation</h5>
        <div class="table-responsive">
          <table class="table align-middle small mb-0">
            <thead class="table-light">
              <tr>
                <th>Event</th>
                <th>Reviewer</th>
                <th>Rating</th>
                <th>Comment</th>
                <th class="text-end">Action</th>
              </tr>
            </thead>
            <tbody id="adminReviewsTable"></tbody>
          </table>
        </div>
      </div>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/socket.io/socket.io.js"></script>
  <script src="/js/main.js"></script>
  <script src="/js/admin.js"></script>
  <script>
    async function loadReviewsAndComplaints() {
      try {
        const res = await EventifyApp.api('/admin/reviews');

        document.getElementById('adminComplaintsTable').innerHTML = (res.complaints || []).map(c => `
          <tr>
            <td>
              <div class="fw-bold text-dark">${c.name}</div>
              <div class="text-muted" style="font-size:0.72rem;">${c.email}</div>
            </td>
            <td>
              <span class="ev-badge ev-badge-purple mb-1">${c.category}</span>
              <div class="fw-semibold">${c.subject}</div>
            </td>
            <td>${c.message}</td>
            <td>
              <span class="ev-badge ${c.status === 'resolved' ? 'ev-badge-green' : 'ev-badge-amber'}">
                ${c.status.toUpperCase()}
              </span>
            </td>
            <td class="text-end">
              ${c.status !== 'resolved' ? `
                <button onclick="resolveComplaint('${c._id}')" class="btn btn-sm btn-success">Mark Resolved</button>
              ` : '<span class="text-success small fw-bold">Resolved</span>'}
            </td>
          </tr>
        `).join('');

        document.getElementById('adminReviewsTable').innerHTML = (res.reviews || []).map(r => `
          <tr>
            <td class="fw-bold">${r.event ? r.event.title : ''}</td>
            <td>${r.user ? r.user.name : ''}</td>
            <td class="text-warning fw-bold">${'★'.repeat(r.rating)}</td>
            <td>${r.comment}</td>
            <td class="text-end">
              <button onclick="deleteReview('${r._id}')" class="btn btn-sm btn-outline-danger"><i class="fa-solid fa-trash"></i></button>
            </td>
          </tr>
        `).join('');
      } catch (err) {
        EventifyApp.showToast(err.message, 'error');
      }
    }

    async function resolveComplaint(id) {
      try {
        await EventifyApp.api(`/admin/complaints/${id}`, {
          method: 'PUT',
          body: { status: 'resolved', adminResponse: 'Resolved by EVENTIFY Admin Support.' }
        });
        EventifyApp.showToast('Complaint marked as resolved!', 'success');
        loadReviewsAndComplaints();
      } catch (err) {
        EventifyApp.showToast(err.message, 'error');
      }
    }

    async function deleteReview(id) {
      if (!confirm('Delete this review?')) return;
      try {
        await EventifyApp.api(`/reviews/${id}`, { method: 'DELETE' });
        EventifyApp.showToast('Review deleted', 'success');
        loadReviewsAndComplaints();
      } catch (err) {
        EventifyApp.showToast(err.message, 'error');
      }
    }

    document.addEventListener('DOMContentLoaded', loadReviewsAndComplaints);
  </script>
</body>
</html>
