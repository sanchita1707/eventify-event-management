<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manage Categories – EVENTIFY Admin</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">
  <link href="/css/style.css" rel="stylesheet">
</head>
<body>
  <div id="ev-navbar-placeholder"></div>

  <div class="ev-dashboard-wrapper">
    <aside class="ev-sidebar" id="ev-admin-sidebar"></aside>

    <main class="ev-dashboard-main">
      <div class="mb-4">
        <span class="text-danger fw-bold small text-uppercase">Taxonomy</span>
        <h3 class="mb-0">Manage Event Categories</h3>
      </div>

      <div class="row g-4">
        <div class="col-lg-4">
          <div class="ev-card p-4 h-auto">
            <h5 class="fw-bold mb-3">Create New Category</h5>
            <form id="categoryForm">
              <div class="mb-3">
                <label class="form-label small fw-semibold">Category Name *</label>
                <input type="text" id="catName" class="form-control" placeholder="e.g. Robotics & IoT" required>
              </div>
              <div class="mb-3">
                <label class="form-label small fw-semibold">Font Awesome Icon Class</label>
                <input type="text" id="catIcon" class="form-control" value="fa-calendar-star" placeholder="fa-robot">
              </div>
              <div class="mb-3">
                <label class="form-label small fw-semibold">Description</label>
                <textarea id="catDesc" class="form-control" rows="2"></textarea>
              </div>
              <button type="submit" class="btn-ev-primary w-100">Add Category</button>
            </form>
          </div>
        </div>

        <div class="col-lg-8">
          <div class="ev-card p-4 h-auto">
            <h5 class="fw-bold mb-3">Active Categories</h5>
            <div class="table-responsive">
              <table class="table align-middle small mb-0">
                <thead class="table-light">
                  <tr>
                    <th>Icon & Name</th>
                    <th>Description</th>
                    <th>Events</th>
                    <th class="text-end">Action</th>
                  </tr>
                </thead>
                <tbody id="adminCategoriesTable"></tbody>
              </table>
            </div>
          </div>
        </div>
      </div>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/socket.io/socket.io.js"></script>
  <script src="/js/main.js"></script>
  <script src="/js/admin.js"></script>
  <script>
    async function loadCategories() {
      const res = await EventifyApp.api('/categories');
      const cats = res.categories || [];
      document.getElementById('adminCategoriesTable').innerHTML = cats.map(c => `
        <tr>
          <td>
            <div class="d-flex align-items-center gap-2">
              <div class="ev-stat-icon" style="width:36px;height:36px;font-size:0.9rem;"><i class="fa-solid ${c.icon}"></i></div>
              <span class="fw-bold text-dark">${c.name}</span>
            </div>
          </td>
          <td class="text-muted">${c.description || ''}</td>
          <td><span class="ev-badge ev-badge-purple">${c.eventCount || 0}</span></td>
          <td class="text-end">
            <button onclick="deleteCategory('${c._id}')" class="btn btn-sm btn-outline-danger"><i class="fa-solid fa-trash"></i></button>
          </td>
        </tr>
      `).join('');
    }

    document.getElementById('categoryForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      try {
        await EventifyApp.api('/categories', {
          method: 'POST',
          body: {
            name: document.getElementById('catName').value,
            icon: document.getElementById('catIcon').value,
            description: document.getElementById('catDesc').value
          }
        });
        EventifyApp.showToast('Category added!', 'success');
        document.getElementById('categoryForm').reset();
        loadCategories();
      } catch (err) {
        EventifyApp.showToast(err.message, 'error');
      }
    });

    async function deleteCategory(id) {
      if (!confirm('Delete this category?')) return;
      try {
        await EventifyApp.api(`/categories/${id}`, { method: 'DELETE' });
        EventifyApp.showToast('Category removed', 'success');
        loadCategories();
      } catch (err) {
        EventifyApp.showToast(err.message, 'error');
      }
    }

    document.addEventListener('DOMContentLoaded', loadCategories);
  </script>
</body>
</html>
